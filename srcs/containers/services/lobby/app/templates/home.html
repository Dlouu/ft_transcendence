<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login API</title>
  </head>
  <body>
    <div class="lobby">
      <label for="code">Room code (join only):</label>
      <input type="text" id="code" name="code" maxlength="4" size="10" />
      <div>
        <button type="button" id="join-btn">Join</button>
        <button type="button" id="create-btn">Create</button>
      </div>
      <p id="status"></p>
    </div>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
      const socket = io();
      const codeInput = document.getElementById("code");
      const joinBtn = document.getElementById("join-btn");
      const createBtn = document.getElementById("create-btn");
      const statusEl = document.getElementById("status");

      const normalizeCode = (value) =>
        value.replace(/[^a-zA-Z0-9]/g, "").toUpperCase().slice(0, 4);

      const setStatus = (message) => {
        statusEl.textContent = message || "";
      };

      codeInput.addEventListener("input", () => {
        codeInput.value = normalizeCode(codeInput.value);
      });

      joinBtn.addEventListener("click", () => {
        const code = normalizeCode(codeInput.value);
        if (!code || code.length !== 4) {
          setStatus("Please enter a 4-character code to join.");
          return;
        }

        socket.emit("join_lobby_request", { code }, (response) => {
          if (response && response.ok) {
            window.location.href = `/lobby/${response.code}`;
            return;
          }
          setStatus(response?.message || "Unable to join this lobby.");
        });
      });

      createBtn.addEventListener("click", () => {
        if (normalizeCode(codeInput.value)) {
          setStatus("Create generates a random code. Use Join to enter a code.");
        }

        socket.emit("create_lobby", {}, (response) => {
          if (response && response.ok) {
            window.location.href = `/lobby/${response.code}`;
            return;
          }
          setStatus(response?.message || "Unable to create a lobby.");
        });
      });
    </script>
  </body>
</html>
