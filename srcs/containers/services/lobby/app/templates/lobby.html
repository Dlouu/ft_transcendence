<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Lobby</title>
</head>
<body>

  <h1>Nom de la room : {{ code }}</h1>

  <p>Total joueurs (humains + bots) : <span id="player-count">0</span> / 4</p>

  <p>Theme : <span id="theme-label">basic</span></p>

  <ul id="player-list"></ul>

  <button id="ready-btn">Ready?</button>

  <div id="master-panel" style="display:none;">
    <button id="theme-uwu">Theme uwu</button>
    <button id="theme-basic">Theme basic</button>

    <button id="add-bot">+ Bot</button>
    <button id="remove-bot">- Bot</button>
    <button id="start-btn">Start</button>
  </div>


  <div id="add-friend-panel">
    <input type="text" id="friend-username" placeholder="Nom d'utilisateur à ajouter" />
    <button id="add-friend-btn">Ajouter ami</button>
  </div>

<ul id="friend-requests-list"></ul>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
const code = "{{ code }}";
const socket = io();

const readyBtn = document.getElementById("ready-btn");
const masterPanel = document.getElementById("master-panel");
const themeLabel = document.getElementById("theme-label");

socket.on("connect", () => {
  socket.emit("join_lobby", { code: code });
});

socket.on("room_full", (data) => {
    const message = data?.message || "Room is full, returning to lobby";
    alert(message);
    window.location.href = "/";
});

socket.on("lobby_state", (data) => {
  document.getElementById("player-count").textContent = data.total_count;

  // theme affiché pour tout le monde
  themeLabel.textContent = data.theme ? "uwu" : "basic";

  // panel visible seulement pour l'hôte
  masterPanel.style.display = (socket.id === data.supreme_master_sid) ? "block" : "none";

  const list = document.getElementById("player-list");
  list.innerHTML = "";

  data.humans.forEach(player => {
    const li = document.createElement("li");
    const ready = data.ready_humans.includes(player);
    const crown = (player === data.supreme_master_sid) ? " 👑" : "";
    li.textContent = player + (ready ? " ✅" : " ❌") + crown;
    list.appendChild(li);
  });

  data.bots.forEach(bot => {
    const li = document.createElement("li");
    li.textContent = bot + " 🤖 ✅";
    list.appendChild(li);
  });
});

readyBtn.addEventListener("click", () => {
  socket.emit("player_ready");
});

// THEME (host only - le serveur re-vérifie)
document.getElementById("theme-uwu").addEventListener("click", () => {
  socket.emit("set_theme", { theme: true });
});

document.getElementById("theme-basic").addEventListener("click", () => {
  socket.emit("set_theme", { theme: false });
});

// BOTS + START
document.getElementById("add-bot").addEventListener("click", () => {
  socket.emit("add_bot");
});

document.getElementById("remove-bot").addEventListener("click", () => {
  socket.emit("remove_bot");
});

document.getElementById("start-btn").addEventListener("click", () => {
  socket.emit("master_start");
});

socket.on("game_start", (data) => {
  window.location.href = `/game/${data.code}`;
});

socket.on("error", (data) => {
  alert(data.message || "Error");
});

// friends
document.getElementById("remove-bot").addEventListener("click", () => {
  const username = document.getElementById("friend-username").value.trim();
  if (!username) return alert("Veuillez entrer un nom d'utilisateur");

  socket.emit("add_friend", {username: username});

  document.getElementById("friend-username").value = "";

});


socket.on("friend_request_sent", (data) => {
  const list = document.getElementById("friend-requests-list");

  const li = document.createElement("li");
  li.id = `req-${data.username}`;
  li.textContent = `${data.username} - ${data.status} `;

  if (data.type === "received") {
    const acceptbtn = document.createElement("button");
    acceptbtn.textContent = "✅";
    acceptbtn.onclick = () => socket.emit("accept_friend", {requester_id: data.user_id, accepter_id: currentUserId});

    const rejectbtn = document.createElement("button");
    rejectbtn.textContent = "❌";
    rejectbtn.onclick = () => socket.emit("accept_friend", {requester_id: data.user_id, accepter_id: currentUserId});

    li.appendChild(acceptbtn);
      li.appendChild(rejectbtn);
    }

    list.appendChild(li);
  });

  socket.on("friend_updated", (data) => {
    const li = document.getElementById(`req-${data.username}`);
    if (li) {
      li.textContent = `${data.username} - ${data.status}`;
    }
  });
  </script>

  </body>
  </html>
