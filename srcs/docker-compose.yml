services:
  nginx:
    container_name: service_nginx
    build: ./containers/services/nginx
    restart: on-failure
    volumes:
      # - nginx_data:/var/www/nginx
      - service_logs:/logs
      - ./containers/services/website/app/dist:/usr/share/nginx/html
    depends_on:
      - api
    ports:
      - 8080:80
      - 4443:443
    networks:
      - api_network
      - website_network
      - game_network
      - lobby_network
  redis:
    container_name: service_redis
    image: redis:8.4
    networks:
      - redis_network
    volumes:
      - service_logs:/logs
  website:
    container_name: service_website
    build:
      context: ./containers/services/website
    restart: on-failure
    volumes:
      - service_logs:/logs
    depends_on:
      - api
    networks:
      - website_network
  api:
    container_name: service_api
    build: ./containers/services/api
    restart: on-failure
    env_file:
      - env/api.env
    volumes:
      - api_data:/var/www/api
      - service_logs:/logs
    networks:
      - api_network
      - auth_network
      - website_network
      - game_network
      - redis_network
      - user_db_network
      - lobby_network
  auth:
    container_name: service_auth
    build: ./containers/services/auth
    restart: on-failure
    env_file:
      - env/auth.env
    depends_on:
      - auth_db
    volumes:
      - service_logs:/logs
    networks:
      - auth_network
      - redis_network
      - auth_db_network
  game:
    container_name: service_game
    build:
      context: ./containers/services/game
    restart: on-failure
    env_file:
      - env/game.env
    volumes:
      - service_logs:/logs
    networks:
      - game_network
  lobby:
    container_name: lobby_game
    build: ./containers/services/lobby
    restart: on-failure
    env_file:
      - env/lobby.env
    networks:
      - lobby_network
      - redis_network
      - user_db_network
      - game_network
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    env_file:
      - env/elasticsearch.env
    ports:
      - "5065:9200"
    networks:
      - elk_network
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - elk_network
  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.0
    user: root
    volumes:
      - service_logs:/logs
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    depends_on:
      - elasticsearch
    networks:
      - elk_network
  auth_db:
    container_name: auth_db
    build: ./containers/databases/auth_db
    restart: unless-stopped
    env_file:
      - env/auth_db.env
    volumes:
      - auth_db_data:/var/lib/mysql
      - service_logs:/logs
    networks:
      - auth_db_network
  user_db:
    container_name: user_db
    build: ./containers/databases/user_db
    restart: unless-stopped
    env_file:
      - env/user_db.env
    volumes:
      - user_db_data:/var/lib/mysql
      - service_logs:/logs
    networks:
      - user_db_network

volumes:
  api_data:
  auth_db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/srcs/volumes/auth_db_volume
  user_db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/srcs/volumes/user_db_volume
  service_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/srcs/volumes/service_logs

networks:
  mariadb_network:
    driver: bridge
  auth_network:
    driver: bridge
  api_network:
    driver: bridge
  game_network:
    driver: bridge
  website_network:
    driver: bridge
  auth_db_network:
    driver: bridge
  user_db_network:
    driver: bridge
  redis_network:
    driver: bridge
  lobby_network:
    driver: bridge
  elk_network:
    driver: bridge
